name: Cobrinha do perfil

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

jobs:
  gerar-cobrinha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Gerar animações
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23933DCA
            dist/snake-dark.svg?palette=github-dark&color_snake=%23D5A6FF

      - name: Publicar animações
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
